# pages/ の中身だけを GitHub Pages に公開する
# 公開先: https://micomprocedure.github.io/change-change-change/
name: Deploy pages

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開中に次の push が来たら、古い方を止めて新しい方だけを公開する
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
